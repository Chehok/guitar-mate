<style>
:root { color-scheme: light; --paper:#f6f4ec; --panel:#fffef9; --soft:#ecefe5; --ink:#203a33; --muted:#596b62; --line:#d9dfd3; --control:#7c8e7d; --green:#245b47; --on-green:#fffef9; --focus:#9a651b; --radius:16px; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Pretendard Variable",system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:15px; line-height:1.6; word-break:keep-all; }
button,input { font:inherit; }
:where(button,input,a):focus-visible { outline:3px solid var(--focus); outline-offset:3px; }

header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; }
.brand { display:flex; align-items:center; gap:10px; color:inherit; text-decoration:none; }
.brand img { display:block; width:40px; height:40px; border-radius:12px; }
.brand-name { white-space:nowrap; font-size:21px; font-weight:800; letter-spacing:-.8px; line-height:1.25; }
.brand-subtitle { display:block; margin-top:3px; color:var(--muted); font-size:12px; font-weight:450; letter-spacing:0; }
.mode-tabs { display:flex; gap:4px; margin-bottom:28px; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:thin; border-bottom:1px solid var(--line); }
.mode-tabs a { display:flex; flex:1 0 max-content; align-items:center; justify-content:center; min-height:48px; padding:10px 14px 12px; border-bottom:3px solid transparent; color:var(--muted); text-decoration:none; font-size:14px; font-weight:550; white-space:nowrap; }
.mode-tabs a[aria-current=page] { color:var(--ink); border-bottom-color:var(--green); font-weight:750; }
main { max-width:620px; margin:auto; }
h1 { margin:0 0 8px; font-size:clamp(24px,3vw,30px); font-weight:700; line-height:1.4; letter-spacing:-.9px; }
.intro { margin:0 0 24px; color:var(--muted); font-size:14px; line-height:1.7; }
.panel { padding:24px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); }
.metronome-layout { display:grid; gap:20px; align-items:center; }
.metronome-figure { display:block; width:100%; max-width:210px; height:auto; margin:auto; }
@media (min-width:560px) { .metronome-layout { grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:24px; } }
.tempo-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.tempo-row label { font-weight:650; }
.tempo-value { display:flex; align-items:center; gap:8px; color:var(--muted); }
.tempo-value input { width:88px; min-height:44px; padding:6px 10px; border:1px solid var(--control); border-radius:10px; background:var(--panel); color:var(--ink); text-align:center; font-size:18px; font-variant-numeric:tabular-nums; }
.tempo-slider { display:block; width:100%; margin:18px 0 4px; accent-color:var(--green); }
.tempo-limits { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
.beats { display:grid; grid-template-columns:repeat(4,minmax(0,56px)); justify-content:center; gap:clamp(8px,2vw,16px); margin:24px 0; padding:0; list-style:none; }
.beats li { display:grid; place-items:center; aspect-ratio:1; border:1px solid var(--line); border-radius:50%; color:var(--muted); background:var(--soft); font-size:20px; font-variant-numeric:tabular-nums; transition:transform .08s ease, background-color .08s ease, color .08s ease; }
.beats li:first-child { font-weight:750; }
.beats li.active { transform:scale(1.12); background:var(--green); border-color:var(--green); color:var(--on-green); }
.start-button { width:100%; min-height:52px; border:1px solid var(--green); border-radius:10px; background:var(--green); color:var(--on-green); font-weight:700; cursor:pointer; }
.start-button:active { transform:translateY(1px); }
.status { min-height:24px; margin:12px 0 0; color:var(--muted); text-align:center; font-size:13px; }
footer { padding:18px 0 8px; color:var(--muted); font-size:12px; line-height:1.8; }
@media (min-width:760px) { .wrap { padding:32px; } header { margin-bottom:28px; } .brand { gap:12px; } .brand-name { font-size:24px; } .brand-subtitle { font-size:13px; } .mode-tabs { margin-bottom:32px; } .mode-tabs a { font-size:15px; } .panel { padding:32px; } }
@media (prefers-color-scheme:dark) { :root { color-scheme:dark; --paper:#131713; --panel:#1c221d; --soft:#29332b; --ink:#f0f1e6; --muted:#b2beb1; --line:#374438; --control:#7c907d; --green:#a2d2b5; --on-green:#172c21; --focus:#e8c879; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; animation:none !important; scroll-behavior:auto !important; } .beats li.active { transform:none; } }

<body>
<div class="wrap">
<header><a class="brand" href="./"><img src="./favicon.svg" width="40" height="40" alt=""><span class="brand-name">기타메이트<span class="brand-subtitle">기타 연습 도우미</span></span></a><a class="guide-launch" href="./guide.html#example-metronome">사용 가이드</a></header>

<main>
<h1>메트로놈</h1>
<p class="intro">박자에 맞춰 천천히, 정확하게 연습해 보세요.</p>
<section class="panel" aria-label="메트로놈 설정">
<div class="metronome-layout">
<svg class="metronome-figure" viewBox="0 0 252 225" aria-hidden="true" focusable="false">
  <ellipse cx="126" cy="210" rx="86" ry="7" fill="var(--ink)" opacity=".12"/>
  <path d="M65 194v10q0 4 4 4h13q4 0 4-4v-10m80 0v10q0 4 4 4h13q4 0 4-4v-10" fill="#193e32"/>
  <path d="M194 178h20" stroke="#b49a64" stroke-width="5"/>
  <circle cx="222" cy="178" r="8" fill="none" stroke="#b49a64" stroke-width="3"/>
  <path d="m101 36 20-12q5-3 10 0l20 12 51 154q3 10-7 10H57q-10 0-7-10Z" fill="#2e624d" stroke="var(--ink)" stroke-width="1.5"/>
  <path d="M108 43h36l39 125H69Z" fill="#193e32" stroke="#507b63" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="116" y="47" width="20" height="123" rx="4" fill="#f2ead3"/>
  <path d="M120 57h12m-8 8h8m-12 8h12m-8 8h8m-12 8h12m-8 8h8m-12 8h12m-8 8h8m-12 8h12m-8 8h8m-12 8h12m-8 8h8m-12 8h12m-8 8h8" stroke="#637661" stroke-width="1"/>
  <path d="M56 172h140l6 18q3 10-7 10H57q-10 0-7-10Z" fill="#dcd0ac" stroke="var(--ink)" stroke-width="1.5"/>
  <path d="M60 193h132" stroke="#ac996a" stroke-width="1.5" stroke-linecap="round"/>
  <g id="pendulum">
    <path d="M126 178V32" stroke="#193e32" stroke-width="6" stroke-linecap="round"/>
    <path d="M126 178V32" stroke="#e4c88c" stroke-width="3" stroke-linecap="round"/>
    <rect x="111" y="76" width="30" height="16" rx="4" fill="#e4c88c" stroke="#193e32" stroke-width="1.5"/>
    <path d="M116 82h20" stroke="#967945" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <circle cx="126" cy="178" r="6" fill="#193e32" stroke="#e4c88c" stroke-width="2"/>
</svg>
<div>
<div class="tempo-row"><label for="tempo-range">템포</label><div class="tempo-value"><input id="tempo-value" type="number" min="40" max="240" step="1" value="100" inputmode="numeric" aria-label="분당 박자 수"><span>BPM</span></div></div>
<input class="tempo-slider" id="tempo-range" type="range" min="40" max="240" step="1" value="100" aria-label="템포 조절">
<div class="tempo-limits" aria-hidden="true"><span>40</span><span>240</span></div>
<ol class="beats" aria-label="4분의 4박자"><li data-beat="0">1</li><li data-beat="1">2</li><li data-beat="2">3</li><li data-beat="3">4</li></ol>
<button class="start-button" id="start-stop" type="button" aria-pressed="false">시작</button>
<p class="status" id="status" role="status" aria-live="polite">시작을 누르면 메트로놈이 재생됩니다.</p>
</div>
</div>
</section>
<footer>첫 박은 조금 더 강하게 들립니다. 기기 음량과 무음 설정을 확인해 주세요.<br><a href="./about.html">소개 · 문의</a> · <a href="./privacy.html">개인정보처리방침</a></footer>
</main>
</div>
<script>
'use strict';
const tempoRange=document.getElementById('tempo-range');
const tempoValue=document.getElementById('tempo-value');
const startStop=document.getElementById('start-stop');
const status=document.getElementById('status');
const beats=[...document.querySelectorAll('.beats li')];
const pendulum=document.getElementById('pendulum');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let audioContext=null,timer=null,running=false,nextBeat=0,nextBeatTime=0;
let displayedBeat=null,animationFrame=null;
const sources=new Set(),scheduledBeats=[];
function setTempo(raw){const bpm=Math.max(40,Math.min(240,Math.round(Number(raw)||100)));tempoRange.value=tempoValue.value=bpm;}
tempoRange.addEventListener('input',()=>setTempo(tempoRange.value));
tempoValue.addEventListener('change',()=>setTempo(tempoValue.value));
function audibleTime(){
  const timestamp=audioContext.getOutputTimestamp?.();
  if(timestamp?.performanceTime>0){
    return Math.min(audioContext.currentTime,timestamp.contextTime+(performance.now()-timestamp.performanceTime)/1000);
  }
  return audioContext.currentTime-(audioContext.baseLatency||0)-(audioContext.outputLatency||0);
}
function discardOlderBeats(time){
  // Keep the latest audible beat as the start of the current swing.
  while(scheduledBeats.length>1&&scheduledBeats[1].time<=time)scheduledBeats.shift();
}
function paintPendulum(){
  if(!running)return;
  animationFrame=requestAnimationFrame(paintPendulum);
  if(audioContext.state!=='running')return;

  const time=audibleTime();
  discardOlderBeats(time);
  const current=scheduledBeats[0];
  if(!current||current.time>time)return;

  if(current!==displayedBeat){
    beats.forEach((item,index)=>{
      item.classList.toggle('active',index===current.beat);
      if(index===current.beat)item.setAttribute('aria-current','step');
      else item.removeAttribute('aria-current');
    });
    displayedBeat=current;
  }
  if(reducedMotion.matches){
    pendulum.removeAttribute('transform');
    return;
  }
  const phase=Math.min(1,(time-current.time)/current.interval);
  const direction=current.beat%2===0?-1:1;
  // Each click is a center crossing; the swing reverses halfway between clicks.
  const angle=27*direction*Math.sin(Math.PI*phase);
  pendulum.setAttribute('transform',`rotate(${angle} 126 178)`);
}
function playClick(time,beat){
  const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
  oscillator.type='square';oscillator.frequency.setValueAtTime(beat===0?1320:880,time);
  gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(beat===0?.2:.13,time+.002);gain.gain.exponentialRampToValueAtTime(.0001,time+.045);
  oscillator.connect(gain);gain.connect(audioContext.destination);sources.add(oscillator);oscillator.onended=()=>sources.delete(oscillator);oscillator.start(time);oscillator.stop(time+.05);
}
function schedule(){
  if(!running||audioContext.state!=='running')return;
  if(document.hidden)discardOlderBeats(audibleTime());
  const now=audioContext.currentTime;
  nextBeatTime=Math.max(now,nextBeatTime);
  while(nextBeatTime<now+.12){
    const interval=60/tempoRange.valueAsNumber;
    playClick(nextBeatTime,nextBeat);
    scheduledBeats.push({time:nextBeatTime,beat:nextBeat,interval});
    nextBeatTime+=interval;
    nextBeat=(nextBeat+1)%beats.length;
  }
}
function stop(){
  running=false;
  clearInterval(timer);
  cancelAnimationFrame(animationFrame);
  timer=animationFrame=displayedBeat=null;
  sources.forEach(source=>{try{source.stop();}catch(_){}});
  sources.clear();
  scheduledBeats.length=0;
  pendulum.removeAttribute('transform');
  beats.forEach(item=>{item.classList.remove('active');item.removeAttribute('aria-current');});
  startStop.textContent='시작';
  startStop.setAttribute('aria-pressed','false');
  status.textContent='메트로놈을 멈췄습니다.';
}
startStop.addEventListener('click',async()=>{
  if(running){stop();return;}
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass){status.textContent='이 브라우저에서는 오디오 재생을 지원하지 않습니다.';return;}
  startStop.disabled=true;
  try{
    audioContext??=new AudioContextClass();
    if(audioContext.state==='suspended')await audioContext.resume();
    running=true;
    nextBeat=0;
    nextBeatTime=audioContext.currentTime+.05;
    startStop.textContent='멈추기';
    startStop.setAttribute('aria-pressed','true');
    status.textContent='메트로놈 재생 중';
    schedule();
    timer=setInterval(schedule,25);
    animationFrame=requestAnimationFrame(paintPendulum);
  }catch(_){
    stop();
    status.textContent='소리를 시작하지 못했어요. 브라우저 음량 설정을 확인해 주세요.';
  }finally{
    startStop.disabled=false;
  }
});
window.addEventListener('pagehide',()=>{if(running)stop();});
if('serviceWorker' in navigator&&window.isSecureContext)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
</script>
</body>
</html>
