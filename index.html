<style>
:root {
  color-scheme: light;
  --paper: #f6f4ec;
  --panel: #fffef9;
  --soft: #ecefe5;
  --ink: #203a33;
  --muted: #596b62;
  --line: #d9dfd3;
  --control: #7c8e7d;
  --green: #245b47;
  --on-green: #fffef9;
  --green-hover: #194a38;
  --lime: #dfea9c;
  --orange: #a34625;
  --error: #a12f20;
  --focus: #9a651b;
  --fret: #72816e;
  --string: #71816d;
  --neck: #f1eee3;
  --inlay: #b0b39f;
  --note: #dce4d3;
  --note-ink: #314a3c;
  --hit: #245b4718;
  --radius: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Pretendard Variable", system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
button, input { font: inherit; }
button, .mode-tabs a, input { -webkit-tap-highlight-color: transparent; }
button { min-height: 44px; padding: 10px 14px; border: 1px solid var(--control); border-radius: 10px; background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 550; line-height: 1.4; transition: background-color .16s ease, border-color .16s ease, transform .16s ease; }
button:active:not(:disabled) { transform: translateY(1px); background: var(--soft); }
button:disabled { color: var(--muted); border-color: var(--line); background: var(--soft); cursor: default; }
:where(button, input, a, [tabindex]):focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
input { min-height: 44px; border: 1px solid var(--control); border-radius: 10px; background: var(--panel); color: var(--ink); font-size: 16px; }
input::placeholder { color: var(--muted); opacity: 1; }
input[type=range] { accent-color: var(--green); cursor: pointer; }
::selection { background: var(--lime); color: #203a33; }
p { margin: 0; }
/* 1100px canvas: twelve 77px columns + eleven 16px gutters.
   Main row spans 4 / 8: 356px + 16px + 728px = 1100px. */
.search { display: flex; gap: 8px; max-width: 728px; }
.search input { min-width: 0; flex: 1; width: 100%; min-height: 52px; padding: 10px 14px; font-size: 20px; font-weight: 550; }
.search button { flex: none; padding-inline: 14px; }
.primary { background: var(--green); border-color: var(--green); color: var(--on-green); font-weight: 650; }
button.primary:active:not(:disabled) { background: var(--green-hover); border-color: var(--green-hover); }
.hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); line-height: 1.8; }
.error { min-height: 24px; margin-top: 4px; color: var(--error); font-size: 13px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 24px; }
.quick button { min-width: 44px; padding: 8px 13px; font-size: 14px; border-color: var(--line); }
.quick button[aria-pressed=true] { background: var(--soft); border-color: var(--green); color: var(--green); }
.filter-status { margin: 0; flex: 1; min-width: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.filter-status strong { color: var(--ink); font-size: 15px; }
.filter-reset { flex: none; min-height: 44px; padding: 4px 12px; font-size: 13px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.chord-title { font-size: 36px; font-weight: 500; line-height: 1.2; letter-spacing: -1px; margin: 0; overflow-wrap: anywhere; }
.quality { color: var(--muted); font-size: 13px; margin-top: 6px; }
.play { flex: none; padding: 8px 10px; font-size: 13px; }
.diagram { display: block; width: 100%; max-width: 290px; height: auto; margin: 8px auto; overflow: visible; }
.diagram text, .neck text { font-family: inherit; }
.diagram-editor { max-width: 330px; min-width: 0; }
.nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.nav button { padding-inline: 12px; }
.counter { color: var(--muted); text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.tones { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.tone { min-width: 64px; padding: 12px 16px; background: var(--soft); border-radius: 10px; text-align: center; }
.tone.root { background: var(--green); color: var(--on-green); }
.tone strong { display: block; font-size: 24px; font-weight: 500; }
.tone small { font-size: 12px; }
.details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; border-top: 1px solid var(--line); padding-top: 20px; }
.details span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.details strong { font-size: 14px; font-weight: 550; font-variant-numeric: tabular-nums; }
.key { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--note); border: 1px solid var(--fret); }
.key.root { background: var(--orange); border-color: var(--orange); }
.key.current { background: var(--green); outline: 2px solid var(--ink); outline-offset: 2px; border: 0; }
.scroll { overflow-x: auto; overscroll-behavior-x: contain; margin-top: 12px; padding: 8px 16px; scrollbar-color: var(--control) var(--soft); }
.scroll:focus-visible { outline-offset: -4px; }
.neck { display: block; width: 100%; min-width: 1010px; height: auto; }
.empty { padding: 48px 8px; text-align: center; color: var(--muted); }
#audio-status { min-height: 18px; margin-top: 8px; font-size: 12px; color: var(--muted); }
/* Tuner: one screen — reading on top, a headstock whose pegs pick the string, then the mic */
/* Same headstock colours as the sheet transposer's neck: green head, fret-grey edges and tuners, light strings and posts. */
.tuner-display { --wood: var(--green); --wood-dark: var(--fret); --peg: var(--neck); --peg-string: var(--neck); text-align: center; }
.tuner-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; }
.tuner-target { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.auto-switch { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 12px 4px 6px; border-radius: 20px; border-color: var(--line); font-size: 13px; font-weight: 650; }
.switch-track { position: relative; width: 36px; height: 22px; border-radius: 11px; background: var(--fret); transition: background .15s; }
.switch-knob { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.auto-switch[aria-checked=true] .switch-track { background: var(--green); }
.auto-switch[aria-checked=true] .switch-knob { transform: translateX(14px); }
.tuner-note { font-size: 48px; font-weight: 550; line-height: 1.15; margin: 4px 0 0; letter-spacing: -2px; }
.tuner-frequency { min-height: 20px; margin: 0; color: var(--muted); font-size: 13px; }
.tuner-gauge { display: block; width: 100%; max-width: 290px; margin: 6px auto 0; color: var(--orange); overflow: visible; }
.tuner-gauge text { font-family: inherit; font-weight: 600; }
.tuner-display.in-tune .tuner-gauge, .tuner-display.in-tune .tuner-advice { color: var(--green); }
.tuner-display.waiting .tuner-gauge, .tuner-display.waiting .tuner-advice { color: var(--muted); }
#tuner-needle { transform-origin: 200px 290px; transition: transform .12s ease-out; }
.tuner-cents { margin: 4px 0 0; font-size: 20px; font-weight: 500; }
.tuner-note, .tuner-frequency, .tuner-cents, .mic-sensitivity output { font-variant-numeric: tabular-nums; }
.tuner-advice { min-height: 22px; margin: 2px 0 8px; color: var(--orange); font-size: 14px; font-weight: 650; }
.headstock { display: grid; grid-template-columns: 52px 150px 52px; grid-template-rows: repeat(3, 50px) 22px; justify-content: center; align-items: center; column-gap: 6px; }
.headstock-art { grid-column: 2; grid-row: 1 / span 4; width: 100%; height: 100%; }
.headstock button { width: 46px; height: 46px; padding: 0; border-radius: 50%; border-color: var(--line); background: var(--panel); display: grid; place-content: center; line-height: 1.05; }
.headstock button strong { font-size: 19px; font-weight: 600; }
.headstock button small { font-size: 10px; color: var(--muted); }
.headstock button[aria-pressed=true] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.headstock button[aria-pressed=true] small { color: inherit; opacity: .8; }
.headstock button.detected { outline: 3px solid var(--orange); outline-offset: 2px; }
.tuner-display.in-tune .headstock button.detected { outline-color: var(--green); }
.headstock button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.headstock-hint { min-height: 20px; margin: 8px 0 0; color: var(--muted); font-size: 12px; }
.tuner-mic { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
#mic-toggle { width: 100%; max-width: 320px; min-height: 48px; }
#mic-status { min-height: 20px; max-width: 420px; margin: 6px auto 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
.mic-sensitivity { display: grid; grid-template-columns: auto minmax(0, 1fr) 3em; align-items: center; gap: 10px; max-width: 320px; margin: 8px auto 0; color: var(--muted); font-size: 13px; text-align: left; }
.mic-sensitivity input { width: 100%; margin: 0; accent-color: var(--green); }
.mic-sensitivity output { text-align: right; color: var(--ink); font-weight: 600; }
@media (min-width: 760px) {
  .tuner-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
  .tuner-gauge { max-width: 360px; }
  .headstock { grid-template-columns: 58px 162px 58px; grid-template-rows: repeat(3, 54px) 24px; }
  .headstock button { width: 50px; height: 50px; }
}
#identify-play { flex: none; padding-inline: 12px; font-size: 13px; white-space: nowrap; }
#identify-reset { flex: none; }
#identify-audio-status { min-height: 22px; margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.identify-candidates { display: grid; gap: 8px; padding-left: 24px; }
.identify-candidates li::marker { color: var(--muted); font-size: 13px; }
.identify-candidates > li > button { width: 100%; padding: 12px 14px; text-align: left; border-color: var(--line); }
.identify-candidates strong { display: block; font-size: 22px; font-weight: 550; }
.identify-candidates small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
#identify-status { font-size: 14px; }
.identify-hit { cursor: pointer; touch-action: manipulation; }
.identify-hit:focus { outline: none; }
.identify-hit:focus-visible rect { fill: var(--hit); stroke: var(--focus); stroke-width: 2.5; }
@media (hover: hover) {
  button:hover:not(:disabled) { background: var(--soft); border-color: var(--green); }
  .headstock button[aria-pressed=true]:hover:not(:disabled) { background: var(--green-hover); color: var(--on-green); }
  button.primary:hover:not(:disabled) { background: var(--green-hover); color: var(--on-green); border-color: var(--green-hover); }
  .identify-hit:hover rect { fill: var(--hit); stroke: var(--green); stroke-width: 2; }
}
@media (min-width: 760px) {
  .layout { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); }
  .panel { padding: 24px; }
}
@media (min-width: 760px) and (max-width: 1023px) {
  .layout { grid-template-columns: minmax(300px, 1fr) minmax(0, 1fr); }
  .panel { padding: 20px; }
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #131713; --panel: #1c221d; --soft: #29332b;
    --ink: #f0f1e6; --muted: #b2beb1; --line: #374438; --control: #7c907d;
    --green: #a2d2b5; --on-green: #172c21; --green-hover: #b9e0c8;
    --lime: #dfea9c; --orange: #efb17f; --error: #ffa392; --focus: #e8c879;
    --fret: #83977e; --string: #92a58d; --neck: #242c24; --inlay: #67755f;
    --note: #3c513d; --note-ink: #ecf1e5; --hit: #a2d2b524;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
/* Score editor uses the existing paper, panel and guitar palette in both themes. */
.score-guide{ margin-bottom:16px; }
.score-guide h2 { font-size:16px; margin:0; }
.score-guide ol { padding-left:24px; }
#score-panel label { display:inline-flex; align-items:center; gap:6px; }
#score-paste-area { min-height:80px; padding:12px; border:1px dashed var(--control); border-radius:10px; }
#score-paste-area:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
#score-file { display:block; max-width:100%; width:100%; padding:10px; margin-top:8px; }
#score-panel input[type=radio],#score-panel input[type=checkbox] { width:18px; min-height:18px; height:18px; accent-color:var(--green); }
#score-panel fieldset { border:0; margin:16px 0; padding:0; min-width:0; }
#score-panel legend { font-weight:650; font-size:14px; }
#score-panel select { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--control); border-radius:10px; min-height:44px; padding:8px; margin-top:8px; max-width:100%; }
#score-panel select:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
#score-panel output { min-width:100px; text-align:center; font-variant-numeric:tabular-nums; }
.score-frets { display:flex; min-width:576px; background:var(--neck); }
.score-frets button { flex:1; border:0; border-right:2px solid var(--fret); border-radius:0; min-width:48px; min-height:100px; position:relative; background:transparent; padding:0; isolation:isolate; }
.score-frets button::before { content:''; position:absolute; inset:22px 0; background:repeating-linear-gradient(to bottom,var(--string) 0,var(--string) 1px,transparent 1px,transparent 10px); z-index:-1; }
.score-frets button:first-child { border-right:5px solid var(--fret); }
.score-frets button span { background:var(--neck); padding:3px; }
.score-frets button[aria-pressed=true] { background:var(--green); color:var(--on-green); }
.score-frets button[aria-pressed=true] span { background:var(--green); }
.score-stage { position:relative; width:100%; }
#score-canvas { display:block; width:100%; height:auto; touch-action:pan-y; }
#score-hit-layer { position:absolute; inset:0; pointer-events:none; }
.score-code-hit { position:absolute; min-height:26px; min-width:28px; padding:0; border:1px dashed transparent; border-radius:3px; background:transparent; pointer-events:auto; transform:translateY(-3px); }
.score-code-hit:focus-visible,.score-code-hit:hover { border-color:var(--orange); background:var(--hit); }
.score-stage.adding { cursor:crosshair; outline:3px solid var(--focus); outline-offset:-3px; }
.score-stage.adding #score-hit-layer { display:none; }
#score-code-list { margin-bottom:0; }
#score-edit-text { display:block; width:100%; padding:10px; margin:10px 0; }

<script data-main-app data-mode="tuner">

'use strict';
function neck(v){const x=f=>f===0?59:112+(f-1)*62,y=i=>35+(5-i)*35;let s='';
for(let f=0;f<=15;f++)s+=`<text x="${x(f)}" y="17" text-anchor="middle" fill="var(--muted)" font-size="12">${f}</text>`;
s+='<rect x="81" y="30" width="930" height="185" rx="4" fill="var(--neck)"/>';
for(let f=0;f<=15;f++){const xx=81+f*62;s+=`<line x1="${xx}" x2="${xx}" y1="30" y2="215" stroke="var(--fret)" stroke-width="${f===0?5:1}"/>`;}
for(const f of [3,5,7,9,12,15]){if(f===12){for(const yy of [87.5,157.5])s+=`<circle cx="${x(f)}" cy="${yy}" r="4" fill="var(--inlay)"/>`;}else s+=`<circle cx="${x(f)}" cy="122.5" r="4" fill="var(--inlay)"/>`;}
for(let i=0;i<6;i++){
s+=`<text x="17" y="${y(i)+4}" text-anchor="middle" font-size="12" fill="var(--muted)">${['E','A','D','G','B','e'][i]}</text><line x1="43" x2="1011" y1="${y(i)}" y2="${y(i)}" stroke="var(--string)" stroke-width="${1+i*.15}"/>`;
for(let f=0;f<=15;f++){const pc=mod(tuning[i]+f),selected=v&&v.frets[i]===f;if(!selected&&!current.tones.some(t=>mod(current.pc+t[0])===pc))continue;const root=pc===current.pc;
s+=`<circle cx="${x(f)}" cy="${y(i)}" r="${selected?14:12}" fill="${root?'var(--orange)':selected?'var(--green)':'var(--note)'}" ${selected?'stroke="var(--ink)" stroke-width="2.5"':''}/><text x="${x(f)}" y="${y(i)+4}" text-anchor="middle" font-size="${noteName(current,pc).length>2?9:11}" font-weight="${root||selected?700:500}" fill="${root||selected?'var(--on-green)':'var(--note-ink)'}">${noteName(current,pc)}</text>`;
}}
return svg(s,'0 0 1040 237','neck',`${current.label} 코드 구성음의 전체 지판 위치. 근음은 주황색, 현재 운지는 테두리로 표시.`);}
function render(){const v=voicings[position];$('chord-title').textContent=current.label;$('quality').textContent=current.name;$('diagram').innerHTML=diagram(v);$('counter').textContent=voicings.length?`보이싱 ${position+1}/${voicings.length}`:'보이싱 없음';$('prev').disabled=$('next').disabled=voicings.length<2;$('play').disabled=!v;
$('tones').replaceChildren(...current.tones.map(t=>{const div=document.createElement('div');div.className='tone'+(t[0]===0?' root':'');const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=toneName(current,t);small.textContent=t[1];div.append(strong,small);return div;}));
$('frets').textContent=v?v.frets.map(f=>f<0?'X':f).join(' · '):'—';$('bass').textContent=v?noteName(current,v.bass)+(v.bass===current.pc?' · 근음':' · 전위형'):'—';$('shape').textContent=v?v.name+(v.omitted.length?' · 생략: '+v.omitted.join(', '):''):'—';$('neck').innerHTML=neck(v);$('audio-status').textContent='';document.querySelectorAll('#quick button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===current.label)));}
let identifyPlaybackRequest=0;
// Capture switches the iOS session/route and can leave an older output context silent; rebuild it on the next tap.
function retirePlaybackContext(){const old=audioContext;audioContext=null;if(old){try{old.close();}catch(_){}}}
function audioBus(ctx){
if(!ctx.chordBus){const comp=ctx.createDynamicsCompressor(),master=ctx.createGain();comp.threshold.value=-12;comp.knee.value=10;comp.ratio.value=12;comp.attack.value=.003;comp.release.value=.2;master.connect(comp);comp.connect(ctx.destination);ctx.chordBus=master;}
return ctx.chordBus;
}
// Phone speakers barely reproduce the low-string fundamentals, so upper partials carry the pitch there.
const referenceWeights=[1,.6,.45,.35,.25,.15];
function scheduleReference(ctx,frequency,at){return scheduleTone(ctx,audioBus(ctx),frequency,at,referenceLevel,referenceDecay,referenceWeights,.025);}
// YIN: cumulative mean normalized difference, then a parabolic period estimate.
// Kept independent of the DOM so synthetic signals can exercise the real detector in Node.
function detectPitch(samples,sampleRate){
// Average down to at most 24 kHz to keep the longer buffer inexpensive.
const stride=Math.max(1,Math.ceil(sampleRate/24000));
if(stride>1){
const reduced=new Float32Array(Math.floor(samples.length/stride));
for(let i=0;i<reduced.length;i++){let sum=0;for(let j=0;j<stride;j++)sum+=samples[i*stride+j];reduced[i]=sum/stride;}
samples=reduced;sampleRate/=stride;
}
const size=Math.floor(samples.length/2),maxLag=Math.min(size-1,Math.ceil(sampleRate/70)+1),minLag=Math.max(2,Math.floor(sampleRate/1000)-1);
let mean=0;for(const value of samples)mean+=value;mean/=samples.length;
let energy=0;for(const value of samples)energy+=(value-mean)**2;
if(Math.sqrt(energy/samples.length)<.00015)return null;
const difference=new Float64Array(maxLag+1);let sum=0;
for(let lag=1;lag<=maxLag;lag++){
let squared=0;for(let i=0;i<size;i++){const delta=samples[i]-samples[i+lag];squared+=delta*delta;}
sum+=squared;difference[lag]=sum?squared*lag/sum:1;
}
let periodLag=0;
for(let lag=minLag;lag<maxLag;lag++){
if(difference[lag]>.15)continue;
while(lag+1<maxLag&&difference[lag+1]<difference[lag])lag++;
periodLag=lag;break;
}
if(!periodLag||periodLag>=maxLag)return null;
// A dominant overtone can pass YIN first. Prefer a multiple only when its
// periodicity is substantially better; pure high notes must retain their octave.
const firstLag=periodLag;
for(let multiple=2;multiple<=4;multiple++){
const expected=firstLag*multiple,radius=Math.ceil(multiple*1.5);
let best=0;
for(let lag=Math.max(minLag,expected-radius);lag<Math.min(maxLag,expected+radius+1);lag++){
if(!best||difference[lag]<difference[best])best=lag;
}
if(best&&difference[best]<difference[periodLag]*.25&&difference[periodLag]-difference[best]>.008)periodLag=best;
}
const left=difference[periodLag-1],center=difference[periodLag],right=difference[periodLag+1],curve=left-2*center+right;
const period=periodLag+(curve?(left-right)/(2*curve):0),frequency=sampleRate/period;
// Allow the interpolation's three-cent error margin at the range edges.
const edgeTolerance=2**(3/1200);
return frequency>=70/edgeTolerance&&frequency<=1000*edgeTolerance?Math.max(70,Math.min(1000,frequency)):null;
}

const stringNames=['E2','A2','D3','G3','B3','E4'];
const stringFrequency=(index,a=440)=>a*2**((tuning[index]-69)/12);
const pitchCents=(frequency,target)=>1200*Math.log2(frequency/target);
function nearestString(frequency,a){let best=0;for(let i=1;i<tuning.length;i++)if(Math.abs(pitchCents(frequency,stringFrequency(i,a)))<Math.abs(pitchCents(frequency,stringFrequency(best,a))))best=i;return best;}
let recentPitches=[],lastPitchAt=0,referenceUntil=0,playbackRequest=0;
function resetTuner(){
recentPitches=[];lastPitchAt=0;
$('tuner-display').className='panel tuner-display waiting';
$('tuner-target').textContent=selectedString===null?'자동 줄 인식 · 소리를 기다립니다':`${6-selectedString}번 줄 · 목표 ${stringNames[selectedString]} · ${stringFrequency(selectedString,concertA).toFixed(2)} Hz`;
$('tuner-note').textContent=selectedString===null?'—':stringNames[selectedString];
$('tuner-frequency').textContent=selectedString===null?'A4 = 440 Hz':`목표 ${stringFrequency(selectedString,concertA).toFixed(2)} Hz`;
$('tuner-cents').textContent='— 센트';$('tuner-needle').style.transform='rotate(0deg)';
$('tuner-advice').textContent=micStream?'한 줄을 튕겨 주세요.':'마이크를 켜고 한 줄을 튕겨 주세요.';
for(const button of pegButtons())button.classList.remove('detected');
}
function showPitch(frequency){
const index=selectedString===null?nearestString(frequency,concertA):selectedString,target=stringFrequency(index,concertA),cents=pitchCents(frequency,target),inTune=Math.abs(cents)<=5;
$('tuner-display').className='panel tuner-display'+(inTune?' in-tune':'');
$('tuner-target').textContent=`${selectedString===null?'자동 · ':''}${6-index}번 줄 · 목표 ${stringNames[index]} · ${target.toFixed(2)} Hz`;
$('tuner-note').textContent=stringNames[index];$('tuner-frequency').textContent=`감지 ${frequency.toFixed(2)} Hz`;
$('tuner-cents').textContent=`${cents>0?'+':''}${cents.toFixed(1)} 센트`;
$('tuner-needle').style.transform=`rotate(${Math.max(-50,Math.min(50,cents))*.8}deg)`; // ±50 cents = the ±40° arc
const advice=inTune?'맞음 · 정확한 음이에요':cents<0?'낮음 · 줄을 조금 더 조여 주세요':'높음 · 줄을 조금 풀어 주세요';
if($('tuner-advice').textContent!==advice)$('tuner-advice').textContent=advice;
for(const button of pegButtons())button.classList.toggle('detected',Number(button.dataset.string)===index);lastDetected=index;
}
const referenceHint='줄을 누르면 그 줄에 맞추고 기준음을 들려줘요.';
function stopPlayback(){playbackRequest++;identifyPlaybackRequest++;referenceUntil=0;for(const node of playing){try{node.stop();}catch(_){}}playing=[];const status=$('reference-status');if(status)status.textContent=referenceHint;}
function stopMicrophone(message='마이크가 꺼졌습니다. 다시 켜서 튜닝을 시작하세요.'){
const wasCapturing=!!(micStream||micContext);micRequest++;clearInterval(micTimer);micTimer=null;
if(micStream)micStream.getTracks().forEach(track=>track.stop());micStream=null;
if(micSource)micSource.disconnect();micSource=null;
if(micGain)micGain.disconnect();micGain=null;analyser=null;
if(micContext){micContext.close().catch(()=>{});micContext=null;}
$('mic-toggle').disabled=false;$('mic-toggle').textContent='마이크 켜기';$('mic-toggle').setAttribute('aria-pressed','false');
$('mic-status').textContent=message;resetTuner();
if(wasCapturing)retirePlaybackContext();
}
if(ready(['tuner']))$('mic-toggle').addEventListener('click',async()=>{
if(micStream){stopMicrophone();return;}
if(!window.isSecureContext){$('mic-status').textContent='마이크를 사용하려면 HTTPS 주소 또는 localhost에서 열어 주세요. 줄을 눌러 기준음은 들을 수 있어요.';return;}
const Audio=window.AudioContext||window.webkitAudioContext;
if(!navigator.mediaDevices?.getUserMedia||!Audio){$('mic-status').textContent='이 브라우저는 마이크 튜닝을 지원하지 않습니다. 최신 Chrome, Edge, Safari에서 열거나, 줄을 눌러 기준음을 듣고 맞춰 주세요.';return;}
const request=++micRequest;let context=null,stream=null;
$('mic-toggle').disabled=true;$('mic-status').textContent='브라우저에서 마이크 사용을 허용해 주세요.';
try{
stopPlayback();retirePlaybackContext();setAudioSession('auto');context=new Audio();micContext=context;await context.resume();
if(request!==micRequest)return;
stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
if(request!==micRequest||$('tuner-panel').hidden||document.hidden){stream.getTracks().forEach(track=>track.stop());return;}
micStream=stream;micSource=context.createMediaStreamSource(stream);analyser=context.createAnalyser();analyser.fftSize=context.sampleRate>48000?16384:8192;analyser.smoothingTimeConstant=0;
micGain=context.createGain();micGain.gain.value=Number($('mic-sensitivity').value);micSource.connect(micGain);micGain.connect(analyser);
const samples=new Float32Array(analyser.fftSize);
$('mic-toggle').disabled=false;$('mic-toggle').textContent='마이크 끄기';$('mic-toggle').setAttribute('aria-pressed','true');
$('mic-status').textContent='마이크 사용 중 · 한 줄씩 튕겨 주세요. 다른 페이지로 이동하면 마이크가 꺼집니다.';resetTuner();
stream.getTracks().forEach(track=>track.addEventListener('ended',()=>{if(request===micRequest)stopMicrophone('마이크 연결이 끊겼습니다. 연결과 권한을 확인한 뒤 다시 켜 주세요.');}));
context.onstatechange=()=>{if(request===micRequest&&context.state==='suspended')stopMicrophone('오디오가 일시 중지되었습니다. 마이크를 다시 켜 주세요.');};
micTimer=setInterval(()=>{
if(performance.now()<referenceUntil){recentPitches=[];return;}
analyser.getFloatTimeDomainData(samples);const frequency=detectPitch(samples,context.sampleRate),now=performance.now();
if(frequency===null){if(lastPitchAt&&now-lastPitchAt>1800)resetTuner();return;}
lastPitchAt=now;
if(recentPitches.length&&Math.abs(pitchCents(frequency,recentPitches.at(-1)))>80)recentPitches=[];
recentPitches.push(frequency);if(recentPitches.length>3)recentPitches.shift();
if(recentPitches.length>=3)showPitch([...recentPitches].sort((a,b)=>a-b)[Math.floor(recentPitches.length/2)]);
},80);
}catch(error){
if(stream)stream.getTracks().forEach(track=>track.stop());
if(request!==micRequest)return;
const messages={NotAllowedError:'마이크 권한이 거부되었습니다. 주소창의 사이트 설정에서 마이크를 허용한 뒤 다시 켜 주세요. 줄을 눌러 기준음은 들을 수 있어요.',SecurityError:'브라우저의 보안 설정에서 마이크 사용을 허용해 주세요. HTTPS 또는 localhost 주소인지도 확인해 주세요.',NotFoundError:'마이크를 찾을 수 없습니다. 기기에 마이크를 연결한 뒤 다시 시도해 주세요.',NotReadableError:'마이크를 열 수 없습니다. 다른 앱의 마이크 사용을 종료하고 다시 시도해 주세요.'};
stopMicrophone(messages[error.name]||'마이크를 시작하지 못했습니다. 연결과 브라우저 권한을 확인한 뒤 다시 시도해 주세요.');
}finally{if(request!==micRequest&&context&&context.state!=='closed')context.close().catch(()=>{});}
});
// Pegs around the headstock: left D·A·E (strings 4·5·6), right G·B·E (strings 3·2·1), top to bottom.
const pegLayout=[[2,1,1],[1,1,2],[0,1,3],[3,3,1],[4,3,2],[5,3,3]];
let lastDetected=null;
const pegButtons=()=>$('string-select').querySelectorAll('button[data-string]');
function selectString(index){selectedString=index;$('auto-string').setAttribute('aria-checked',String(index===null));for(const button of pegButtons())button.setAttribute('aria-pressed',String(Number(button.dataset.string)===index));resetTuner();}
async function playReference(index){
const name=stringNames[index];
stopPlayback();const request=playbackRequest;
try{
await prepareAudio();if(request!==playbackRequest||$('tuner-panel').hidden)return;
const frequency=stringFrequency(index,concertA),tone=scheduleReference(audioContext,frequency,audioContext.currentTime+.02);
const osc=tone.oscs[0];playing=[tone.voice];referenceUntil=performance.now()+2150;resetTuner();
$('tuner-advice').textContent='기준음 재생 중 · 잠시 듣고 비교하세요.';
$('reference-status').textContent=`${6-index}번 줄 ${name} · ${frequency.toFixed(2)} Hz 재생 중`;
osc.addEventListener('ended',()=>{if(request===playbackRequest){playing=[];$('reference-status').textContent=referenceHint;resetTuner();}});
confirmPlayback(audioContext,()=>request===playbackRequest,()=>{$('reference-status').textContent=audioFailure;});
}catch(_){if(request===playbackRequest)$('reference-status').textContent=audioFailure;}
}
if(ready(['tuner'])){
$('auto-string').addEventListener('click',()=>selectString(selectedString===null?(lastDetected??0):null));
for(const [index,column,row] of pegLayout){
const name=stringNames[index],peg=document.createElement('button');peg.type='button';peg.dataset.string=index;
peg.innerHTML=`<strong>${name[0]}</strong><small>${6-index}</small>`;peg.setAttribute('aria-label',`${6-index}번 줄 ${name}`);peg.setAttribute('aria-pressed','false');
peg.style.gridColumn=column;peg.style.gridRow=row;
peg.addEventListener('click',()=>{selectString(index);playReference(index);});
$('string-select').append(peg);
}
$('mic-sensitivity').addEventListener('input',()=>{
const gain=Number($('mic-sensitivity').value);$('mic-gain-value').textContent=`${gain}×`;
if(micGain)micGain.gain.setTargetAtTime(gain,micContext.currentTime,.02);
});
}




// End score music functions.


// Stop sound when the page goes away.
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMicrophone();stopPlayback();}});window.addEventListener('pagehide',()=>{stopMicrophone();stopPlayback();});
</script>
