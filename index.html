<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f6f4eb">
    <title>기타메이트 주소 이전 안내</title>
    <style>
      :root { color-scheme: light; font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; color: #173b35; background: #f6f4eb; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 36px; border: 1px solid #d8dfd1; border-radius: 20px; background: #fffefa; box-shadow: 0 20px 60px #173b3514; text-align: center; }
      h1 { margin: 0 0 14px; font-size: clamp(1.5rem, 6vw, 2rem); letter-spacing: -.04em; }
      p { margin: 0; color: #536963; line-height: 1.7; }
      a { display: inline-flex; justify-content: center; margin-top: 28px; padding: 13px 20px; border-radius: 10px; background: #1e6755; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #d5a746; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main role="dialog" aria-modal="true" aria-labelledby="notice-title">
      <h1 id="notice-title">기타메이트 주소가 변경되었습니다</h1>
      <p>보안 이슈 대응을 위해 이 GitHub Pages 페이지를 종료하고 새 주소로 이전했습니다.</p>
      <a href="https://guitar-mate.pages.dev/">새 기타메이트로 이동</a>
    </main>
  </body>
</html>
