<script data-main-app data-mode="identify">

'use strict';
// Reuse the search parser for chord formulas, spellings and optional degrees.
const identifyRoots=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const identifyEnharmonics={'C#':'Db','Eb':'D#','F#':'Gb','Ab':'G#','Bb':'A#'};
const identifyQualities=[...new Set([...Object.keys(types),'m9','maj9','11','m11','maj11','13','m13','maj13','madd9','add11','madd11','6add9','m6add9','m(maj7)','m(maj9)','7sus2','7sus4','9sus4','13sus4','7b5','7#5','7b9','7#9','7b13','7b9b13','7#9b13','9#11','maj7#11','maj9#11','m7b13'])];
const identifyFormulas=identifyRoots.flatMap(root=>identifyQualities.map(quality=>parse(root+quality)));
function identifyChord(frets){
if(!Array.isArray(frets)||frets.length!==6||frets.some(f=>!Number.isInteger(f)||f< -1||f>24))throw Error('6개 줄에 -1부터 24까지의 프렛을 입력해 주세요.');
const notes=frets.flatMap((f,i)=>f<0?[]:[tuning[i]+f]);
const pcs=[...new Set(notes.map(mod))];if(pcs.length<2)return [];
const bass=mod(Math.min(...notes)),result=[];
for(const chord of identifyFormulas){
const chordPcs=chord.tones.map(t=>mod(chord.pc+t[0]));
const extra=pcs.filter(pc=>!chordPcs.includes(pc));
// A non-chord pedal bass is supported only below a complete chord.
if(extra.some(pc=>pc!==bass)||extra.length>1)continue;
const missing=chord.tones.filter((t,i)=>!pcs.includes(chordPcs[i]));
if(missing.some(t=>!chord.optional.includes(chord.degrees[chord.tones.indexOf(t)])&&t[1]!=='5'))continue;
if(pcs.filter(pc=>chordPcs.includes(pc)).length<2||(extra.length&&missing.length))continue;
const omitted=missing.map(t=>t[1]);
const suffix=missing.map(t=>'no'+chord.degrees[chord.tones.indexOf(t)]).join('');
const slash=bass!==chord.pc;
// The search parser accepts single accidentals in slash bass names.
const bassSpelling=c=>{const name=noteName(c,bass);return chordPcs.includes(bass)&&name.length<=2?name:identifyRoots[bass];};
const bassName=bassSpelling(chord);
const label=chord.root+chord.quality+(suffix?'('+suffix+')':'')+(slash?'/'+bassName:'');
const alternate=identifyEnharmonics[chord.root];
let alias=null;
if(alternate){const alt=parse(alternate+chord.quality);const altBass=bassSpelling(alt);alias=alternate+chord.quality+(suffix?'('+suffix+')':'')+(slash?'/'+altBass:'');}
result.push({label,alias,chord,bass,omitted,notes:pcs,slash,nonChordBass:extra.length>0,score:(slash?1000:0)+missing.length*100+extra.length*30+chord.tones.length});
}
return result.sort((a,b)=>a.score-b.score||a.label.localeCompare(b.label)).slice(0,12);
}
// Optional pure-function regression check for Node VM: checkChordIdentification().
function checkChordIdentification(){
const assert=(ok,message)=>{if(!ok)throw Error(message);};
for(const [shape,name] of Object.entries({x02220:'A','133211':'F',x32010:'C','022000':'Em',x43121:'C#',x02413:'Am9'})){
const candidates=identifyChord([...shape].map(f=>f==='x'?-1:Number(f)));
assert(candidates[0]?.label===name,shape+': expected '+name+', got '+candidates[0]?.label);
}
assert(identifyChord([-1,0,2,0,1,0])[0].label==='Am7','bass root preferred over C6/A');
assert(identifyChord([-1,4,3,1,2,1])[0].alias==='Db','enharmonic name');
assert(identifyChord([-1,-1,-1,-1,-1,-1]).length===0,'empty input');
assert(identifyChord([0,-1,-1,-1,-1,0]).length===0,'single pitch class');
assert(identifyChord([12,3,2,0,1,0])[0].label==='C','actual lowest pitch');
assert(identifyChord([0,3,2,0,1,0]).some(c=>c.label==='C/E'),'inversion');
assert(identifyChord([2,3,2,0,1,0]).some(c=>c.label==='C/F#'),'non-chord slash bass');
assert(identifyChord([-1,0,-1,0,2,-1]).some(c=>c.label==='A7(no5)'),'omitted fifth');
assert(identifyChord([-1,-1,2,4,1,3]).some(c=>c.label==='Am9(no1)/E'),'omitted root');
let rejected=false;try{identifyChord([25,0,0,0,0,0]);}catch(_){rejected=true;}assert(rejected,'invalid fret');
return true;
}
function neck(v){const x=f=>f===0?59:112+(f-1)*62,y=i=>35+(5-i)*35;let s='';
for(let f=0;f<=15;f++)s+=`<text x="${x(f)}" y="17" text-anchor="middle" fill="var(--muted)" font-size="12">${f}</text>`;
s+='<rect x="81" y="30" width="930" height="185" rx="4" fill="var(--neck)"/>';
for(let f=0;f<=15;f++){const xx=81+f*62;s+=`<line x1="${xx}" x2="${xx}" y1="30" y2="215" stroke="var(--fret)" stroke-width="${f===0?5:1}"/>`;}
for(const f of [3,5,7,9,12,15]){if(f===12){for(const yy of [87.5,157.5])s+=`<circle cx="${x(f)}" cy="${yy}" r="4" fill="var(--inlay)"/>`;}else s+=`<circle cx="${x(f)}" cy="122.5" r="4" fill="var(--inlay)"/>`;}
for(let i=0;i<6;i++){
s+=`<text x="17" y="${y(i)+4}" text-anchor="middle" font-size="12" fill="var(--muted)">${['E','A','D','G','B','e'][i]}</text><line x1="43" x2="1011" y1="${y(i)}" y2="${y(i)}" stroke="var(--string)" stroke-width="${1+i*.15}"/>`;
for(let f=0;f<=15;f++){const pc=mod(tuning[i]+f),selected=v&&v.frets[i]===f;if(!selected&&!current.tones.some(t=>mod(current.pc+t[0])===pc))continue;const root=pc===current.pc;
s+=`<circle cx="${x(f)}" cy="${y(i)}" r="${selected?14:12}" fill="${root?'var(--orange)':selected?'var(--green)':'var(--note)'}" ${selected?'stroke="var(--ink)" stroke-width="2.5"':''}/><text x="${x(f)}" y="${y(i)+4}" text-anchor="middle" font-size="${noteName(current,pc).length>2?9:11}" font-weight="${root||selected?700:500}" fill="${root||selected?'var(--on-green)':'var(--note-ink)'}">${noteName(current,pc)}</text>`;
}}
return svg(s,'0 0 1040 237','neck',`${current.label} 코드 구성음의 전체 지판 위치. 근음은 주황색, 현재 운지는 테두리로 표시.`);}
function render(){const v=voicings[position];$('chord-title').textContent=current.label;$('quality').textContent=current.name;$('diagram').innerHTML=diagram(v);$('counter').textContent=voicings.length?`보이싱 ${position+1}/${voicings.length}`:'보이싱 없음';$('prev').disabled=$('next').disabled=voicings.length<2;$('play').disabled=!v;
$('tones').replaceChildren(...current.tones.map(t=>{const div=document.createElement('div');div.className='tone'+(t[0]===0?' root':'');const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=toneName(current,t);small.textContent=t[1];div.append(strong,small);return div;}));
$('frets').textContent=v?v.frets.map(f=>f<0?'X':f).join(' · '):'—';$('bass').textContent=v?noteName(current,v.bass)+(v.bass===current.pc?' · 근음':' · 전위형'):'—';$('shape').textContent=v?v.name+(v.omitted.length?' · 생략: '+v.omitted.join(', '):''):'—';$('neck').innerHTML=neck(v);$('audio-status').textContent='';document.querySelectorAll('#quick button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===current.label)));}
let identifyFrets=Array(6).fill(0),identifyStart=1;
const displayChord=name=>name.replace(/#/g,'♯').replace(/b/g,'♭');
let identifyPlaybackRequest=0;
async function playIdentifyFrets(){
const frets=identifyFrets.slice(),pcs=new Set(frets.flatMap((f,i)=>f<0?[]:[mod(tuning[i]+f)]));
if(pcs.size<2){$('identify-audio-status').textContent='소리를 들으려면 치는 줄이 두 개 이상이고 서로 다른 음이 두 개 이상 있어야 합니다.';return;}
stopPlayback();
const request=identifyPlaybackRequest;
try{
const ctx=await prepareAudio();
if(request!==identifyPlaybackRequest||document.hidden)return;
const tones=scheduleChord(ctx,frets,ctx.currentTime+.03);
const voices=tones.map(t=>t.voice);
playing=voices;$('identify-audio-status').textContent='입력 운지 재생 중';
tones[tones.length-1].oscs[0].addEventListener('ended',()=>{
if(request!==identifyPlaybackRequest)return;
playing=[];$('identify-audio-status').textContent='재생 완료';
});
confirmPlayback(ctx,()=>request===identifyPlaybackRequest,()=>{$('identify-audio-status').textContent=audioFailure;});
}catch(_){if(request===identifyPlaybackRequest)$('identify-audio-status').textContent=audioFailure;}
}
function renderIdentify(){
// Display barres independently of whether a grip fits within four fingers.
const barres=[];
for(const fret of new Set(identifyFrets.filter(f=>f>0))){
for(let i=0;i<6;i++){if(identifyFrets[i]!==fret)continue;let end=i;for(let j=i+1;j<6&&identifyFrets[j]>=fret;j++)if(identifyFrets[j]===fret)end=j;if(end>i){barres.push({fret,from:i,to:end});i=end;}}
}
$('identify-diagram').innerHTML=diagram({frets:identifyFrets,fingers:[],barres},identifyStart);
$('identify-frets').textContent=identifyFrets.map(f=>f<0?'X':f).join(' · ');
const candidates=identifyChord(identifyFrets);
const pcs=[...new Set(identifyFrets.flatMap((f,i)=>f<0?[]:[mod(tuning[i]+f)]))];
const offscreen=identifyFrets.some(f=>f>0&&(f<identifyStart||f>=identifyStart+5));
$('identify-status').textContent=(pcs.length<2?'서로 다른 음을 두 개 이상 선택해 주세요.':candidates.length?`${candidates.length}개 후보 · 최저음 ${displayChord(identifyRoots[candidates[0].bass])}`:`일치하는 후보가 없습니다. 구성음: ${pcs.map(pc=>displayChord(identifyRoots[pc])).join(' · ')}`)+(offscreen?' · 표시 범위 밖에도 누른 음이 있습니다.':'');
const sounding=identifyFrets.filter(f=>f>=0).length,canPlay=sounding>=2&&pcs.length>=2;
$('identify-play').disabled=!canPlay;
$('identify-play').setAttribute('aria-label',canPlay?'입력 운지 소리 듣기':'입력 운지가 부족해 소리를 들을 수 없습니다');
$('identify-candidates').replaceChildren(...candidates.map(candidate=>{
const li=document.createElement('li'),button=document.createElement('button'),title=document.createElement('strong'),details=document.createElement('small'),tones=document.createElement('small');
button.type='button';title.textContent=displayChord(candidate.label)+(candidate.alias?' / '+displayChord(candidate.alias):'');
details.textContent=(candidate.slash?(candidate.nonChordBass?'슬래시 코드 · 비구성음 베이스':'슬래시 코드 · 전위형'):'최저음 = 근음')+(candidate.omitted.length?' · 생략: '+candidate.omitted.join(', '):' · 구성음 일치');
tones.textContent='구성음 · 음정: '+candidate.chord.tones.filter(t=>candidate.notes.includes(mod(candidate.chord.pc+t[0]))).map(t=>displayChord(toneName(candidate.chord,t))+' ('+t[1]+')').join(' · ')+(candidate.nonChordBass?' · 베이스 '+displayChord(identifyRoots[candidate.bass]):'');
button.append(title,details,tones);
button.addEventListener('click',()=>{
  const url=new URL($('chords-tab').href);
  url.searchParams.set('chord',candidate.label);
  location.assign(url.href);
});
li.append(button);return li;
}));
}
function toggleIdentify(event){
const target=event.target.closest('[data-string]');if(!target)return;
if(event.type==='keydown'){if(!['Enter',' '].includes(event.key))return;event.preventDefault();}
const i=Number(target.dataset.string),fret=Number(target.dataset.fret);
stopPlayback();
identifyFrets[i]=fret===0?(identifyFrets[i]===0?-1:0):(identifyFrets[i]===fret?-1:fret);
renderIdentify();$('identify-diagram').querySelector(`[data-string="${i}"][data-fret="${fret}"]`).focus();
}
if(ready(['identify'])){$('identify-diagram').addEventListener('click',toggleIdentify);$('identify-diagram').addEventListener('keydown',toggleIdentify);$('identify-start').addEventListener('change',()=>{identifyStart=Math.max(1,Math.min(20,Math.round(Number($('identify-start').value)||1)));$('identify-start').value=identifyStart;renderIdentify();});$('identify-reset').addEventListener('click',()=>{stopPlayback();identifyFrets=Array(6).fill(0);identifyStart=1;$('identify-start').value=1;renderIdentify();});$('identify-play').addEventListener('click',playIdentifyFrets);renderIdentify();}
function scheduleChord(ctx,fretsList,at){return scheduleStrum(ctx,fretsList.map((f,i)=>f>=0?tuning[i]+f:null).filter(midi=>midi!==null),at);}

let recentPitches=[],lastPitchAt=0,referenceUntil=0,playbackRequest=0;
function stopPlayback(){playbackRequest++;identifyPlaybackRequest++;referenceUntil=0;for(const node of playing){try{node.stop();}catch(_){}}playing=[];for(const id of ['reference-status','identify-audio-status']){const status=$(id);if(status)status.textContent='';}}




// End score music functions.


// Stop sound when the page goes away.
window.addEventListener('pagehide',stopPlayback);

</script>
