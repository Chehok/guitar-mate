<style>
:root {
  color-scheme: light;
  --paper: #f6f4ec;
  --panel: #fffef9;
  --soft: #ecefe5;
  --ink: #203a33;
  --muted: #596b62;
  --line: #d9dfd3;
  --control: #7c8e7d;
  --green: #245b47;
  --on-green: #fffef9;
  --green-hover: #194a38;
  --lime: #dfea9c;
  --orange: #a34625;
  --root-soft: #eed8c7;
  --root-ink: #814022;
  --neck-tone-soft: #e3e9dc;
  --error: #a12f20;
  --focus: #9a651b;

  --string: #71816d;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Pretendard Variable", system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
button, input { font: inherit; }
button, .mode-tabs a, input { -webkit-tap-highlight-color: transparent; }
button { min-height: 44px; padding: 10px 14px; border: 1px solid var(--control); border-radius: 10px; background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 550; line-height: 1.4; transition: background-color .16s ease, border-color .16s ease, transform .16s ease; }
button:active:not(:disabled) { transform: translateY(1px); background: var(--soft); }
button:disabled { color: var(--muted); border-color: var(--line); background: var(--soft); cursor: default; }
:where(button, input, a, [tabindex]):focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
input { min-height: 44px; border: 1px solid var(--control); border-radius: 10px; background: var(--panel); color: var(--ink); font-size: 16px; }
input::placeholder { color: var(--muted); opacity: 1; }
input[type=range] { accent-color: var(--green); cursor: pointer; }
::selection { background: var(--lime); color: #203a33; }
p { margin: 0; }
/* 1100px canvas: twelve 77px columns + eleven 16px gutters.
   Main row spans 4 / 8: 356px + 16px + 728px = 1100px. */
.search { display: flex; gap: 8px; max-width: 728px; }
.search input { min-width: 0; flex: 1; width: 100%; min-height: 52px; padding: 10px 14px; font-size: 20px; font-weight: 550; }
.search button { flex: none; padding-inline: 14px; }
.primary { background: var(--green); border-color: var(--green); color: var(--on-green); font-weight: 650; }

.quick button { min-width: 44px; padding: 8px 13px; font-size: 14px; border-color: var(--line); }
.quick button[aria-pressed=true] { background: var(--soft); border-color: var(--green); color: var(--green); }

  /* Wide screens: a compact switch instead of a full-width bar */

}

.step-grid button { min-height: 40px; padding: 4px 10px; border-color: var(--line); font-size: 15px; font-weight: 600; }
.step-grid button { padding-inline: 2px; }
.step-grid button[aria-pressed=true] { background: var(--soft); border-color: var(--green); color: var(--green); }
.step-picked { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; margin-bottom: 8px; }
.step-current { min-width: 0; margin: 0; color: var(--muted); font-size: 13px; }
.step-current strong { display: inline-block; padding: 3px 12px; border-radius: 16px; background: var(--soft); color: var(--green); font-size: 15px; font-weight: 700; }
.step-reset:disabled { opacity: .4; background: transparent; cursor: default; }

.step-results { display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }

}

.voicing-panel #audio-status:empty { margin: 0; min-height: 0; }

'use strict';
// Optional regression check: run checkChordVoicings() in a console or Node VM.
function checkChordVoicings(){
const assert=(ok,message)=>{if(!ok)throw Error(message);};
const cmaj7=makeVoicings(parse('Cmaj7')).map(v=>v.frets.join(','));
assert(cmaj7[0]==='-1,3,2,0,0,0'&&!cmaj7.includes('-1,3,2,0,0,-1'),'Cmaj7: keep one open grip');
assert(!['-1,3,2,0,0,3','-1,3,2,-1,0,3'].every(grip=>cmaj7.includes(grip)),'Cmaj7: doubled G variants');
assert(cmaj7.length===10,'Cmaj7: keep the ten highest-ranked distinct voicings');
const d=makeVoicings(parse('D')).map(v=>v.frets.join(','));
assert(d.includes('-1,-1,0,7,7,5')&&!d.includes('-1,-1,-1,7,7,5'),'D: keep the grip with the open bass');
for(const [name,standard,awkward] of [
['Cm','-1,3,5,5,4,3','-1,3,1,0,1,3'],
['D','-1,-1,0,2,3,2','-1,5,4,7,7,5']
]){
const grips=makeVoicings(parse(name));
assert(grips[0]?.frets.join(',')===standard,name+': standard grip must come first');
assert(generatedFingering(awkward.split(',').map(Number))===null,name+': awkward grip passed generation');
assert(!grips.some(v=>v.frets.join(',')===awkward),name+': awkward grip shown');
}
const first={A:'-1,0,2,2,2,0',B:'-1,2,4,4,4,2',Am:'-1,0,2,2,1,0',C:'-1,3,2,0,1,0',Cadd9:'-1,3,2,0,3,3',G:'3,2,0,0,0,3',F:'1,3,3,2,1,1',E7:'0,2,0,1,0,0',Bm:'-1,2,4,4,3,2',Dmaj7:'-1,-1,0,2,2,2'};
Object.assign(first,{'C/E':'0,3,2,0,1,0','C/G':'3,3,2,0,1,0','D/A':'-1,0,0,2,3,2','D/F#':'2,-1,0,2,3,2','G/B':'-1,2,0,0,3,3','Am/C':'-1,3,2,2,1,0'});
const names=['F#m11','G#m7b13','Am9','Bm11','C#m7','E7#9','C7b9b13','Cm(maj7)','C6/9',...Object.keys(first)];
for(const name of names){
const chord=parse(name),grips=makeVoicings(chord),allowed=new Set(chord.tones.map(t=>mod(chord.pc+t[0])));
if(chord.bassPc!==null)allowed.add(chord.bassPc);
assert(grips.length>0,name+': no voicings');
assert(grips.every((v,i)=>v.span!==maxFretSpan||grips.slice(i).every(grip=>grip.span===maxFretSpan)),name+': narrow grips must come first');
if(first[name])assert(grips[0].frets.join(',')===first[name],name+': first voicing changed');
assert(new Set(grips.map(v=>v.frets.join(','))).size===grips.length,name+': duplicate');
for(const v of grips){
const notes=v.frets.flatMap((f,i)=>f<0?[]:[tuning[i]+f]),fretted=v.frets.filter(f=>f>0);
assert(notes.every(n=>allowed.has(mod(n))),name+': non-chord tone');
assert(v.frets.every(f=>f>=-1&&f<=15),name+': fret range');
assert(!fretted.length||Math.max(...fretted)-Math.min(...fretted)<=3,name+': span');
assert(v.fingers.every((f,i)=>v.frets[i]>0?f>=1&&f<=4:f===0),name+': fingers');
for(const finger of new Set(v.fingers.filter(Boolean))){
const strings=v.fingers.flatMap((f,i)=>f===finger?[i]:[]);
if(strings.length<2)continue;
assert(v.barres.some(b=>b.finger===finger&&b.from===strings[0]&&b.to===strings.at(-1)&&strings.every(i=>v.frets[i]===b.fret)&&v.frets.slice(b.from,b.to+1).every(f=>f>=b.fret)),name+': finger assigned to separate strings');
}
assert(chord.bassPc===null||mod(Math.min(...notes))===chord.bassPc,name+': slash bass');
assert(chord.tones.every((t,i)=>notes.some(n=>mod(n)===mod(chord.pc+t[0]))||chord.optional.includes(chord.degrees[i])),name+': required tone omitted');
}}
return true;
}
const neckLayout=window.matchMedia('(max-width: 759px)');
function neck(v,vertical){
const start=vertical?70:62,step=38,end=start+15*step;
const side=vertical?50:30,edge=vertical?262:215;
const fret=f=>f===0?start-22:start+(f-.5)*step;
const string=i=>vertical?56+i*40:35+(5-i)*35;
const point=(along,across)=>vertical?[across,along]:[along,across];
const text=(along,across,label,size=12,fill='var(--muted)',weight=400)=>{
const [x,y]=point(along,across);
return `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="${size}" font-weight="${weight}" fill="${fill}">${label}</text>`;
};
const line=(a,b,c,d,stroke,width)=>{
const [x1,y1]=point(a,b),[x2,y2]=point(c,d);
return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${width}"/>`;
};
const dot=(along,across,r,fill)=>{
const [cx,cy]=point(along,across);
return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/>`;
};
let s='';
for(let f=0;f<=15;f++)s+=text(fret(f),vertical?22:13,f);
const [x,y]=point(start,side),[width,height]=point(end-start,edge-side);
s+=`<rect x="${x}" y="${y}" width="${width}" height="${height}" rx="4" fill="var(--neck)"/>`;
for(let f=0;f<=15;f++){const at=start+f*step;s+=line(at,side,at,edge,'var(--fret)',f===0?5:1);}
const between=(a,b)=>(string(a)+string(b))/2;
for(const f of [3,5,7,9,12,15]){
for(const across of f===12?[between(4,3),between(2,1)]:[between(3,2)])s+=dot(fret(f),across,5,'var(--inlay)');
}
for(let i=0;i<6;i++){
s+=text(vertical?15:12,string(i),['E','A','D','G','B','e'][i]);
s+=line(vertical?32:24,string(i),end,string(i),'var(--string)',1+i*.15);
for(let f=0;f<=15;f++){const pc=mod(tuning[i]+f),selected=v&&v.frets[i]===f;if(!selected&&!current.tones.some(t=>mod(current.pc+t[0])===pc))continue;const root=pc===current.pc;
const fill=selected?(root?'var(--orange)':'var(--green)'):(root?'var(--root-soft)':'var(--neck-tone-soft)');
const ink=selected?'var(--on-green)':(root?'var(--root-ink)':'var(--note-ink)');
const label=noteName(current,pc);
s+=dot(fret(f),string(i),12,fill)+text(fret(f),string(i),label,label.length>2?9:11,ink,600);
}}
return svg(s,vertical?'0 0 280 652':'0 0 650 237',vertical?'neck neck-vertical':'neck',`${current.label} 코드 구성음의 전체 지판 위치. 근음은 주황 계열, 현재 운지는 진한 색으로 표시.`);
}
function renderNeck(){
if(!current)return;
const vertical=neckLayout.matches,scroll=$('neck-scroll');
scroll.tabIndex=vertical?-1:0;
scroll.setAttribute('aria-label',vertical?'0부터 15프렛 세로 지판':'0부터 15프렛 지판, 좌우로 스크롤');
$('neck-note').textContent=vertical?'0–15프렛 · 왼쪽이 6번 줄(낮은 E)':'0–15프렛 · 위쪽이 1번 줄(높은 E) · 지판이 잘리면 좌우로 밀어 보세요.';
$('neck').innerHTML=neck(voicings[position],vertical);
}
neckLayout.addEventListener('change',renderNeck);
function render(){const v=voicings[position];$('chord-title').textContent=current.label;$('quality').textContent=current.name+(current.bassNote?' · 베이스 '+current.bassNote:'');$('diagram').innerHTML=diagram(v);$('counter').textContent=voicings.length?`보이싱 ${position+1}/${voicings.length}`:'보이싱 없음';$('prev').disabled=$('next').disabled=voicings.length<2;$('play').disabled=!v;
$('tones').replaceChildren(...current.tones.map(t=>{const div=document.createElement('div');div.className='tone'+(t[0]===0?' root':'');const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=toneName(current,t);small.textContent=t[1]==='R'?'1':t[1];div.append(strong,small);return div;}));
renderNeck();$('audio-status').textContent='';}
let identifyPlaybackRequest=0;
if(ready(['chords']))$('search').addEventListener('submit',e=>{e.preventDefault();find($('chord-input').value);});
// Filter: pick a root, then any chord on that root, then optionally a slash bass under it.
const stepRootOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let stepRoot=null;
function stepButton(text,pressed,onClick){const b=document.createElement('button');b.type='button';b.textContent=text;b.setAttribute('aria-pressed',String(pressed));b.addEventListener('click',onClick);return b;}
function stepResults(){return stepRoot?chordFilterResults(stepRoot,'all','none'):[];}
// Switching roots keeps the picked chord type and slash bass (Csus4/G → Dsus4/G); a bass that
// would equal the new root is dropped.
function stepCarry(root){
if(!root||!stepRoot||!current)return root;
const base=current.label.split('/')[0];
if(!stepResults().includes(base))return root;
const bass=current.bassPc!==null&&current.bassPc!==filterPc[root]?'/'+stepRootOrder.find(n=>filterPc[n]===current.bassPc):'';
return root+base.slice(stepRoot.length)+bass;
}
function setStep(root){
const carried=stepCarry(root);
stepRoot=root;
const names=stepResults();
if(!names.length){renderSteps();return;}
const keep=current&&names.includes(current.label.split('/')[0])&&current.label.split('/')[0].startsWith(root);
const next=keep&&carried===root||current&&current.label===carried?null:names.includes(carried.split('/')[0])?carried:names[0];
if(next){$('chord-input').value=next;find(next);}else renderSteps();
}
function pickChord(name){$('chord-input').value=name;find(name);}
function renderSteps(){
$('step-roots').replaceChildren(...stepRootOrder.map(r=>stepButton(r,r===stepRoot,()=>setStep(r))));
const names=stepResults(),base=current?current.label.split('/')[0]:'',picked=Boolean(stepRoot&&names.includes(base));
const label=$('step-current');
if(picked){const chip=document.createElement('strong');chip.textContent=current.label;label.replaceChildren(chip);}else label.textContent='기본음을 골라 주세요';
$('filter-reset').disabled=!stepRoot;
$('step-results').hidden=!stepRoot;
const slash=picked&&current.bassPc!==null?'/'+stepRootOrder.find(n=>filterPc[n]===current.bassPc):'';
$('quick').replaceChildren(...names.map(name=>stepButton(name,picked&&name===base,()=>pickChord(name+slash))));
$('bass-row').hidden=!picked;
if(picked){
const rootPc=filterPc[stepRoot],bassPc=current.bassPc;
const basses=stepRootOrder.filter(n=>filterPc[n]!==rootPc);
$('bass-quick').replaceChildren(stepButton('없음',bassPc===null,()=>pickChord(base)),...basses.map(n=>stepButton('/'+n,bassPc===filterPc[n],()=>pickChord(base+'/'+n))));
}else $('bass-quick').replaceChildren();
for(const id of ['quick','bass-quick']){const active=$(id).querySelector('[aria-pressed=true]');if(active)active.scrollIntoView({block:'nearest',inline:'nearest'});}
}
function setFindMode(steps){
$('mode-name').setAttribute('aria-selected',String(!steps));$('mode-steps').setAttribute('aria-selected',String(steps));
$('find-name').hidden=steps;$('chord-steps').hidden=!steps;
if(steps)renderSteps();
}
if(ready(['chords'])){
$('mode-name').addEventListener('click',()=>setFindMode(false));
$('mode-steps').addEventListener('click',()=>setFindMode(true));
$('filter-reset').addEventListener('click',()=>setStep(null));
$('prev').addEventListener('click',()=>{if(voicings.length){position=modIndex(position-1);render();}});$('next').addEventListener('click',()=>{if(voicings.length){position=modIndex(position+1);render();}});}
function modIndex(n){return(n+voicings.length)%voicings.length;}
function scheduleChord(ctx,fretsList,at){return scheduleStrum(ctx,fretsList.map((f,i)=>f>=0?tuning[i]+f:null).filter(midi=>midi!==null),at);}
if(ready(['chords']))$('play').addEventListener('click',async()=>{const v=voicings[position];if(!v)return;try{await prepareAudio();if($('chords-panel').hidden)return;for(const node of playing){try{node.stop();}catch(_){}}playing=[];
const ctx=audioContext,voices=scheduleChord(ctx,v.frets,ctx.currentTime+.03).map(t=>t.voice);playing=voices;$('audio-status').textContent='현재 보이싱을 연주합니다.';confirmPlayback(ctx,()=>playing===voices,()=>{$('audio-status').textContent=audioFailure;});}catch(_){$('audio-status').textContent=audioFailure}});

let recentPitches=[],lastPitchAt=0,referenceUntil=0,playbackRequest=0;
function stopPlayback(){playbackRequest++;identifyPlaybackRequest++;referenceUntil=0;for(const node of playing){try{node.stop();}catch(_){}}playing=[];for(const id of ['reference-status','identify-audio-status']){const status=$(id);if(status)status.textContent='';}}




// End score music functions.


if(ready(['chords'])){
  const input=$('chord-input');
  input.value=new URLSearchParams(location.search).get('chord')?.slice(0,input.maxLength)||input.value;
  find(input.value);
}
// Stop sound when the page goes away.
window.addEventListener('pagehide',stopPlayback);
